# Human-authored semantic overlay. Merged into models generated by
# semantic/reflect.py -- regeneration from the Schema Registry never
# touches this file. Column keys may be Lenses paths (dotted) or the
# flattened attribute name.

topics:
  etd.positions:
    description: >-
      COMPACTED state topic: current net position per key
      (clearing_member_id, account, contract_series). Each record is a
      full replacement snapshot for its key, not a delta.
    synonyms: [positions, open interest by member]
    business_context: Netted post-clearing positions maintained by the CCP.
    application_context: >-
      Lenses SQL: query as `etd.positions`. COMPACTION SEMANTICS: take the
      latest record per key (max _meta.offset per partition/key) before
      any aggregation; aggregating over full history double-counts.
    concept: position.net
    time_dimension: as_of_time
    primary_key: [position_key]
    columns:
      clearing_member_id:
        description: Clearing member holding the position
        concept: counterparty.clearing_member
      net_quantity:
        description: >-
          SIGNED net lots: positive = LONG, negative = SHORT.
        application_rules:
          - Never SUM net_quantity across topic history; compaction means
            history contains superseded snapshots.
          - Total open interest per series = SUM(ABS(net_quantity))/2 over
            the LATEST record per key only.

  emir.trade-reports:
    description: >-
      EMIR trade reports (one record per submission, append-only).
      Dual-sided: each economic trade normally appears twice.
    synonyms: [EMIR reports, transaction reports, TR submissions]
    application_context: >-
      Count economic trades with COUNT(DISTINCT uti). counterparty_1/2 are
      LEIs of legal parties -- never join to clearing member codes.
    time_dimension: reporting_timestamp
    primary_key: [report_id]
    columns:
      uti:
        application_rules:
          - COUNT(DISTINCT uti) = economic trades; COUNT(*) counts
            submissions (approx. double).
      counterparty_1:
        description: LEI of the reporting counterparty (EMIR field 1.4)
        concept: counterparty.emir_reporting
        synonyms: [reporting counterparty, CP1]
      counterparty_2:
        description: LEI of the other counterparty (EMIR field 1.9)
        concept: counterparty.emir_reporting
      action_type:
        application_rules:
          - Live trades = latest action per UTI not in (EROR, TERM).
