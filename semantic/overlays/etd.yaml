# Human-authored semantic overlay for the Schema Registry reflection
# path. Merged by semantic/reflect.py; regeneration never touches this.
# Concept ids reference the registry in semantic/topics.py.

topics:
  etd.positions:
    description: >-
      COMPACTED state topic: netted position per key (member_code,
      account, contract). Each record supersedes the previous one for
      its key.
    synonyms: [positions, open interest by member]
    application_context: >-
      COMPACTED topic: only latest-per-key state is a position. In
      Lenses SQL take the max-_meta.offset record per key before any
      aggregation; full-history aggregates double-count.
    concept: position_snapshot
    time_dimension: as_of
    primary_key: [position_key]
    columns:
      member_code:
        description: CCP membership code holding the position -- NOT an LEI
        concept: clearing_member
      net_quantity:
        description: "Signed: positive LONG, negative SHORT. This, not execution side, is direction."
        application_rules:
          - Never aggregate net_quantity across topic history; compaction
            means history contains superseded snapshots.

  emir.trade-reports:
    description: >-
      EMIR trade reports, one row per report side per lifecycle action.
      Dual-sided: in-scope trades appear twice.
    synonyms: [EMIR reports, transaction reports, TR submissions]
    application_context: >-
      Count economic trades with COUNT(DISTINCT uti). counterparty_lei
      is a legal-entity LEI -- never join to clearing member codes.
    concept: emir_trade_report
    time_dimension: reporting_timestamp
    primary_key: [report_id]
    columns:
      uti:
        application_rules:
          - COUNT(DISTINCT uti) = economic trades; COUNT(*) counts
            report rows (approx. double).
      counterparty_lei:
        description: Reporting counterparty LEI (entity), not a member code
        concept: reporting_counterparty
      action_type:
        application_rules:
          - Live trades = latest action per UTI not in (EROR, TERM).
